<p id="status" role="status" aria-live="polite">Requesting your code…</p>
<form id="verify"><label for="code">Verification code</label><input id="code" type="text" inputmode="numeric" pattern="[0-9]{6}" maxlength="6" autocomplete="one-time-code" disabled>
<button id="submit" type="submit" disabled>Verify code</button></form>
<button id="again" type="button" disabled>Send another code</button>
<p class="hint">Check Spam or Junk if your email is missing. Your code expires in 10 minutes.</p></main>
<script>
(function(){
 var code=document.getElementById('code'), submit=document.getElementById('submit'), again=document.getElementById('again'), status=document.getElementById('status');
 window.mailState=function(message,busy,ready,wait,generation){
   if(code.getAttribute('data-generation')!==String(generation)){code.value='';code.setAttribute('data-generation',generation);}
   if(status.textContent!==message)status.textContent=message;
   code.disabled=busy||!ready;submit.disabled=code.disabled;again.disabled=busy||wait>0;
   again.textContent=wait?'Send again in '+wait+'s':'Send another code';
 };
 document.getElementById('verify').onsubmit=function(){
   if(!submit.disabled && /^[0-9]{6}$/.test(code.value))window.location.href='onmail://verify?code='+encodeURIComponent(code.value);
   else if(!submit.disabled){status.textContent='Enter all six digits from your email.';code.focus();}
   return false;
 };
 again.onclick=function(){if(!again.disabled)window.location.href='onmail://resend';};
})();
</script></body></html>
