main{width:100%;max-width:460px;margin:0 auto;padding:28px 17px 10px;text-align:center;position:relative;

label{display:block;text-align:left;color:#007f9f;font-size:13px;margin-bottom:4px}

.hint{font-size:12px;color:#555;margin:3px auto 12px}
.actions{position:relative;width:100%;margin:auto auto 0;padding:8px 38px 0}
#submit{width:100%;max-width:200px;min-height:40px;border:1px solid #aaa;border-radius:24px;background:#bbb;background:-webkit-linear-gradient(top,#f7f7f7,#aeaeae);color:white;text-shadow:0 1px 2px #555;font:16px Roboto,Arial,sans-serif}

#help img{display:block;width:100%;-webkit-filter:brightness(0)}

<script>
(function(){
 var code=document.getElementById('code'), submit=document.getElementById('submit'), again=document.getElementById('again'), status=document.getElementById('status');
 function updateSend(){submit.disabled=code.disabled||!/^\d{6}$/.test(code.value);}
 code.oninput=updateSend;
 window.mailState=function(message,busy,ready,wait,generation,signIn){
   document.getElementById('title').textContent=signIn?'2-step verification':'Verification';
   document.getElementById('back').disabled=busy;
   if(code.getAttribute('data-generation')!==String(generation)){code.value='';code.setAttribute('data-generation',generation);}
   if(status.textContent!==message)status.textContent=message;
   code.disabled=busy||!ready;updateSend();again.disabled=busy||wait>0;
   again.textContent=wait?'Resend ('+wait+'s)':'Resend';
 };
 document.getElementById('verify').onsubmit=function(){
   if(!submit.disabled && /^[0-9]{6}$/.test(code.value))window.location.href='onmail://verify?code='+encodeURIComponent(code.value);
   else if(!submit.disabled){status.textContent='Enter all six digits from your email.';code.focus();}
   return false;
 };
 again.onclick=function(){if(!again.disabled)window.location.href='onmail://resend';};
 document.getElementById('back').onclick=function(){window.location.href='onmail://back';};
 document.getElementById('help').onclick=function(){window.location.href='onmail://help';};
})();
</script></body></html>
